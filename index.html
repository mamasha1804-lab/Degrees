<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Город сравнений — игра</title><style>*{box-sizing:border-box}body{margin:0;background:#dff5ed;color:#234b46;font:18px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:12px 4%;background:#fff9e9;gap:10px}header small{display:block;font-size:13px}button{font:inherit;cursor:pointer;border:0;border-radius:20px;padding:13px 22px;background:#fff6df;color:#254b45;box-shadow:0 4px 0 #cfb77e}button:focus-visible{outline:4px solid #315acb}header button{font-size:15px}.map{position:relative;max-width:1672px;margin:auto;aspect-ratio:1672/941;background:url('assets/town.webp') center/100% 100% no-repeat}.spot{position:absolute;background:#fff4d9ed;border:3px solid white;font-weight:800;padding:10px 16px;box-shadow:0 4px 0 #91753c;transform:translate(-50%,-50%)}.spot.done{background:#c6f595}.houses{left:18%;top:39%}.toys{left:84%;top:43%}.zoo{left:17%;top:76%}.cafe{left:85%;top:79%}.square{left:51%;top:51%}.start{left:50%;top:90%;background:#b9f268}.instructions{max-width:1000px;margin:20px auto;padding:0 20px;text-align:center}.veil{position:fixed;inset:0;background:#17352bd9;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.veil.open{display:flex}.card{position:relative;background:#fffdf3;border-radius:28px;max-width:760px;width:100%;max-height:94vh;overflow:auto;padding:28px;box-shadow:0 15px 60px #0005;text-align:center}.close{position:absolute;right:12px;top:10px;padding:7px 13px;box-shadow:none}h1{font-size:27px;margin:12px 0}h2{font-size:24px}.scene{display:flex;justify-content:center;gap:20px;align-items:flex-end;min-height:115px;margin:20px 0}.actor{display:flex;flex-direction:column;align-items:center;gap:8px}.actor b{font-size:16px}.emoji{font-size:55px}.question{font-size:25px;font-weight:750}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.choice{background:#e0f3ed;border:2px solid #9ccec0;box-shadow:0 4px 0 #86b2a6}.correct{background:#c6eea5!important}.wrong{background:#ffdfcd!important}.feedback{min-height:54px;font-weight:650}progress{width:100%;height:14px;accent-color:#3cab83}.hint{background:#fff0c9;padding:14px;border-radius:14px;font-size:16px;margin:15px 0}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:650px){body{font-size:15px}header{padding:10px;flex-wrap:wrap}header strong{font-size:16px}.map{min-height:440px;background-size:auto 100%;aspect-ratio:auto;background-position:center}.spot{font-size:12px;padding:9px 7px;max-width:130px}.houses{left:15%;top:38%}.toys{left:84%;top:42%}.zoo{left:15%;top:72%}.cafe{left:85%;top:75%}.card{padding:25px 16px}.question{font-size:21px}.choices{gap:10px}.choice{padding:13px 7px}.scene{gap:13px}.emoji{font-size:42px}}.map .spot{background:transparent;border:0;box-shadow:none;border-radius:18px;padding:0;font-size:0;color:transparent}.map .spot:focus-visible{outline:4px solid #fff;outline-offset:-4px;background:#ffffff25}.map .spot:hover{background:#ffffff12}.map .houses{left:16%;top:28%;width:29%;height:32%}.map .toys{left:84%;top:28%;width:29%;height:35%}.map .zoo{left:17%;top:66%;width:32%;height:38%}.map .cafe{left:85%;top:69%;width:29%;height:48%}.map .square{left:50%;top:53%;width:28%;height:27%}.map .start{left:50%;top:89%;width:25%;height:14%}.map .spot.done:after{content:'⭐';position:absolute;right:10%;top:10%;font-size:26px;filter:drop-shadow(0 2px 3px #46330c)}@media(max-width:650px){.map{min-height:0;aspect-ratio:1672/941;background-size:100% 100%}.map .spot{max-width:none}.map .spot.done:after{font-size:17px}}</style>
<header><div><strong>Учимся с Ларисой Коротаевой</strong><small>Степени сравнения · 4 класс</small></div><span id="total">⭐ 0 / 5</span><button onclick="rules()">📖 Подсказка</button><button onclick="resetGame()">Начать заново</button></header><main><div class="map" aria-label="Город сравнений — выбери локацию"><button class="spot houses" onclick="openLevel(0)">🏡 Улица домов</button><button class="spot toys" onclick="openLevel(1)">🧸 Магазин игрушек</button><button class="spot zoo" onclick="openLevel(2)">🦒 Зооуголок</button><button class="spot cafe" onclick="openLevel(3)">🍰 Кафе</button><button class="spot square" onclick="openLevel(4)">🏆 Площадь</button><button class="spot start" onclick="nextLevel()">ИГРАТЬ ▶</button></div><p class="instructions">Помоги котёнку устроить праздник рекордов! Нажми на любую локацию, выполни 6 заданий и собери 5 звёзд. Ошибся? Попробуй ещё раз!</p></main><div class="veil" id="modal" role="dialog" aria-modal="true" aria-labelledby="heading"><section class="card"><button class="close" onclick="closeModal()" aria-label="Закрыть">✕</button><div id="content"></div></section></div>
<script>
const q=(text,answers,correct,hint,scene)=>({text,answers,correct,hint,scene});
const house=[['🏠','Rose: 3 m'],['🏡','Blue: 5 m'],['🏰','Gold: 8 m']];const bears=[['🧸','Small: 20 cm'],['🧸','Medium: 40 cm'],['🧸','Large: 60 cm']];const animals=[['🐢','Tim: 1 km/h'],['🐇','Rob: 40 km/h'],['🐆','Spot: 100 km/h']];
const levels=[{name:'Улица домов',hint:'К коротким прилагательным добавляем -er или the … -est: tall → taller → the tallest. Than означает «чем».',qs:[q('The Blue house is ___ than the Rose house.',['tall','taller','the tallest'],1,'Сравниваем два дома: tall + er.',house),q('The Gold house is ___.',['the tallest','taller','tall'],0,'Из трёх домов золотой самый высокий.',house),q('The Rose house is ___ than the Blue house.',['shorter','the shortest','short'],0,'Два дома: short → shorter.',house),q('Old → older → ___',['the oldest','the olddest','the older'],0,'Обычно добавляем -est, перед формой ставим the.'),q('New → ___ → the newest',['newwer','newer','newest'],1,'New + er = newer.'),q('The Gold house is taller ___ the Blue house.',['the','than','then'],1,'«Выше, чем» — taller than.',house)]},
{name:'Магазин игрушек',hint:'Big → bigger → the biggest (удваиваем g). Small → smaller → the smallest. Happy → happier → the happiest (y меняется на i).',qs:[q('The Medium bear is ___ than the Small bear.',['bigger','big','the biggest'],0,'Big → bigger.',bears),q('The Large bear is ___.',['bigger','the biggest','biggest'],1,'Нужны the и превосходная степень.',bears),q('The Small bear is ___.',['smaller','the smallest','smallest'],1,'Самый маленький из трёх — the smallest.',bears),q('Happy → ___ → the happiest',['happyer','happier','happiest'],1,'Перед -er буква y меняется на i.'),q('Big → bigger → ___',['the bigest','the biggest','the bigger'],1,'В слове biggest две буквы g.'),q('The Small bear is ___ than the Large bear.',['smaller','the smallest','small'],0,'Сравниваем две игрушки.',bears)]},
{name:'Зооуголок',hint:'Сравнивай данные на карточках. Fast → faster → the fastest; long → longer → the longest; heavy → heavier → the heaviest.',qs:[q('Rob is ___ than Tim.',['fast','faster','the fastest'],1,'40 км/ч больше, чем 1 км/ч.',animals),q('Spot is ___.',['the fastest','faster','fastest'],0,'Spot быстрее всех трёх.',animals),q('Tim is ___ than Rob.',['slow','the slowest','slower'],2,'Медленнее — slower.',animals),q('The giraffe has ___ neck.',['the longest','longer','longest'],0,'«Самая длинная шея» — the longest neck.',[['🦒','Giraffe: 2 m'],['🦓','Zebra: 0.6 m'],['🐇','Rabbit: 0.1 m']]),q('An elephant is ___ than a rabbit.',['heavy','heavier','the heaviest'],1,'Heavy → heavier: y меняем на i.',[['🐘','Elephant: 4,000 kg'],['🐇','Rabbit: 2 kg']]),q('Tim is ___ of the three.',['slower','the slowest','slow'],1,'Из трёх — превосходная степень.',animals)]},
{name:'Кафе',hint:'Исключения: good → better → the best; bad → worse → the worst. Длинные слова: delicious → more delicious → the most delicious.',qs:[q('Good → ___ → the best',['gooder','better','best'],1,'Better — особая форма слова good.'),q('This cake is ___ than that cake. (good)',['better','the best','good'],0,'Слово than подсказывает сравнение двух тортов.'),q('Bad → worse → ___',['the baddest','the worst','the worse'],1,'Запомни: bad, worse, the worst.'),q('This is ___ cake in the café. (good)',['better','best','the best'],2,'Самый хороший — the best.'),q('This dessert is ___ than that dessert. (delicious)',['deliciouser','more delicious','the most delicious'],1,'Для длинного delicious используем more.'),q('This is ___ dessert of all. (delicious)',['more delicious','the most delicious','most delicious'],1,'Самый вкусный — the most delicious.') ]},
{name:'Праздничная площадь',hint:'Финал: для сравнения двух — -er / more и than. Для рекорда среди всех — the … -est / the most. Вспомни исключения!',qs:[q('Выбери: «Мой дом больше твоего».',['My house is biggest than yours.','My house is bigger than yours.','My house is the bigger yours.'],1,'Bigger than — больше, чем.'),q('Выбери: «Она самая высокая».',['She is taller.','She is tallest.','She is the tallest.'],2,'Самая высокая — the tallest.'),q('Beautiful → ___ → the most beautiful',['beautifuler','more beautiful','the beautifulest'],1,'Длинное слово: more beautiful.'),q('Выбери правильное предложение.',['This is the best toy.','This is the goodest toy.','This is best toy.'],0,'Good → better → the best.'),q('The red balloon is ___ than the blue balloon. (big)',['biggest','bigger','the biggest'],1,'Big + er, удваиваем g.'),q('Выбери правильную цепочку.',['bad → badder → the baddest','bad → worse → the worst','bad → worst → the worse'],1,'Исключение: bad → worse → the worst.') ]}];
let done=new Set(),li=0,qi=0,locked=false,returnFocus;const content=document.getElementById('content'),modal=document.getElementById('modal');function show(html){returnFocus=document.activeElement;content.innerHTML=html;modal.classList.add('open');document.querySelector('.close').focus()}function closeModal(){modal.classList.remove('open');returnFocus?.focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&modal.classList.contains('open')){const a=[...modal.querySelectorAll('button:not([hidden]):not(:disabled)')],f=a[0],l=a.at(-1);if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});function rules(){show('<h1 id="heading">📖 Как сравнивать?</h1><div class="hint">tall → taller → the tallest<br>big → bigger → the biggest<br>happy → happier → the happiest<br>beautiful → more beautiful → the most beautiful<br>good → better → the best<br>bad → worse → the worst</div><p>Сравниваем двух: <b>A cat is smaller than a lion.</b><br>Выбираем самого: <b>This is the tallest house.</b></p><button onclick="closeModal()">В город</button>')}function openLevel(i){li=i;qi=0;show('<h1 id="heading">'+levels[i].name+'</h1><p>6 заданий · читай и выбирай ответ</p><div class="hint">'+levels[i].hint+'</div><button onclick="renderQ()">Начать ▶</button>')}function renderQ(){locked=false;const t=levels[li].qs[qi];content.innerHTML='<h1 id="heading">'+levels[li].name+'</h1><p>Задание '+(qi+1)+' из 6</p><progress value="'+qi+'" max="6"></progress>'+(t.scene?'<div class="scene">'+t.scene.map((s,i)=>'<div class="actor"><span class="emoji" style="font-size:'+(36+i*15)+'px">'+s[0]+'</span><b>'+s[1]+'</b></div>').join('')+'</div>':'<div class="scene"><span class="emoji">'+['🏡','🧸','🦒','🍰','🏆'][li]+'</span></div>')+'<p class="question">'+t.text+'</p><div class="choices">'+t.answers.map((a,i)=>'<button class="choice" onclick="answer('+i+',this)">'+a+'</button>').join('')+'</div><div class="feedback" aria-live="polite" id="feedback"></div><div class="actions"><button onclick="hint()">💡 Подсказка</button><button id="next" hidden onclick="advance()">Дальше →</button></div>';document.querySelector('.choice').focus()}function hint(){document.getElementById('feedback').textContent=levels[li].qs[qi].hint}function answer(i,b){if(locked)return;if(i===levels[li].qs[qi].correct){locked=true;b.classList.add('correct');document.getElementById('feedback').textContent='Верно! Отличная работа! ⭐';document.getElementById('next').hidden=false}else{b.classList.add('wrong');document.getElementById('feedback').textContent='Попробуй ещё раз. '+levels[li].qs[qi].hint}}function advance(){if(++qi<6)renderQ();else{done.add(li);update();show('<h1 id="heading">'+(done.size===5?'🏆 Город готов к празднику!':'⭐ Локация пройдена!')+'</h1><div class="scene"><span class="emoji">'+(done.size===5?'🏆🎉🐱':'🌟🐱')+'</span></div><p>'+(done.size===5?'Ты собрал все 5 звёзд и стал мастером сравнений!':'Котёнок благодарит тебя! Собрано звёзд: '+done.size+' из 5.')+'</p><button onclick="closeModal()">В город</button> <button onclick="nextLevel()">'+(done.size===5?'Повторить':'Следующая локация')+'</button>')}}function update(){document.getElementById('total').textContent='⭐ '+done.size+' / 5';document.querySelectorAll('.spot:not(.start)').forEach((b,i)=>{b.classList.toggle('done',done.has(i));b.textContent=['🏡 Улица домов','🧸 Магазин игрушек','🦒 Зооуголок','🍰 Кафе','🏆 Площадь'][i]+(done.has(i)?' ⭐':'')})}function nextLevel(){openLevel([0,1,2,3,4].find(i=>!done.has(i))??0)}function resetGame(){show('<h1 id="heading">Начать заново?</h1><p>Собранные звёзды будут сброшены.</p><button onclick="done.clear();update();closeModal()">Да, начать</button> <button onclick="closeModal()">Продолжить игру</button>')}
</script></html>
